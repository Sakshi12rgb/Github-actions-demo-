
  ```yaml
name: Add CICD workflow for code, build, test, and deploy

on:
  push:
    branches:
      - main

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display code checkout success
        run: echo "Code checkout successful"

  build:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build successful"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "Tests passed"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "Deployment successful"
```
